<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLUX — Creative Motion & Brand Studio</title>
  
  <!-- Google Fonts: Plus Jakarta Sans, Inter, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ----------------------------------------------------
       RESET & ROOT VARIABLES
    ---------------------------------------------------- */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --bg: #ffffff;
      --ink: #17151f;
      --muted: #6a6577;
      --meta: #9a94a6;
      --accent: #7c6cff;
      --accent-grad: linear-gradient(150deg, #a99bff, #7c6cff);
      
      --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      
      --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
    }

    /* ----------------------------------------------------
       BACKGROUND VIDEO & SOFT AMBIENT SCRIM
    ---------------------------------------------------- */
    .bg-video-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(2px) saturate(1.06);
      transform: scale(1.06);
    }

    .bg-scrim {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(255, 255, 255, 0.94) 0%, rgba(255, 255, 255, 0.80) 30%, rgba(255, 255, 255, 0.46) 58%, rgba(255, 255, 255, 0.20) 100%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.85) 0%, transparent 18%, transparent 82%, rgba(255, 255, 255, 0.90) 100%);
    }

    .bg-scrim::after {
      content: '';
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 640px;
      height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 108, 255, 0.10) 0%, transparent 62%);
      pointer-events: none;
    }

    /* ----------------------------------------------------
       PAGE VIEWPORT CONTAINER (100vh, NO SCROLL)
    ---------------------------------------------------- */
    .viewport {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px clamp(28px, 4vw, 60px) 28px;
    }

    /* ----------------------------------------------------
       TOP NAVBAR
    ---------------------------------------------------- */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      background: var(--accent-grad);
      box-shadow: 0 2px 8px rgba(124, 108, 255, 0.35);
      flex-shrink: 0;
    }

    .brand-wordmark {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 21px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-link {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 14px;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: var(--ink);
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
      color: #ffffff;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13px;
      padding: 11px 20px;
      border-radius: 999px;
      box-shadow: 0 2px 10px rgba(23, 21, 31, 0.12);
      transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
    }

    .nav-cta:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 4px 16px rgba(23, 21, 31, 0.20);
    }

    /* ----------------------------------------------------
       HERO CENTER (CENTERED BOTH VERTICALLY & HORIZONTALLY)
    ---------------------------------------------------- */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: auto 0;
      max-width: 900px;
      align-self: center;
      width: 100%;
    }

    .hero-kicker {
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.30em;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
    }

    .hero-kicker::before,
    .hero-kicker::after {
      content: '';
      display: block;
      width: 26px;
      height: 1px;
      background: var(--accent);
      opacity: 0.7;
    }

    .hero-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(64px, 9vw, 136px);
      line-height: 0.92;
      letter-spacing: -0.045em;
      color: var(--ink);
      margin-bottom: 22px;
    }

    .hero-title .dot {
      color: var(--accent);
      display: inline-block;
    }

    .hero-sub {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: clamp(17px, 1.6vw, 20px);
      color: var(--muted);
      max-width: 440px;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .hero-cta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--ink);
      color: #ffffff;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 15px;
      padding: 15px 30px;
      border-radius: 999px;
      box-shadow: 0 4px 20px rgba(23, 21, 31, 0.12), 0 1px 3px rgba(23, 21, 31, 0.08);
      transition: transform 0.25s var(--ease-out), box-shadow 0.25s var(--ease-out);
    }

    .btn-pill svg {
      transition: transform 0.25s var(--ease-out);
    }

    .btn-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(23, 21, 31, 0.20), 0 2px 6px rgba(23, 21, 31, 0.10);
    }

    .btn-pill:hover svg {
      transform: translateX(4px);
    }

    .btn-text-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .btn-text-link::after {
      content: '→';
      display: inline-block;
      color: var(--accent);
      font-family: sans-serif;
      font-size: 15px;
      transition: transform 0.2s var(--ease-out);
    }

    .btn-text-link:hover {
      color: var(--accent);
    }

    .btn-text-link:hover::after {
      transform: translateX(4px);
    }

    /* ----------------------------------------------------
       BOTTOM META ROW
    ---------------------------------------------------- */
    .footer-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .meta-item {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--meta);
    }

    .meta-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.8;
      flex-shrink: 0;
    }

    /* ----------------------------------------------------
       MOTION: STAGGERED BLUR-RISE ENTRANCE
    ---------------------------------------------------- */
    @keyframes blurRise {
      from {
        opacity: 0;
        filter: blur(16px);
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .rise {
      opacity: 0;
      animation: blurRise 1s var(--ease-out) forwards;
    }

    .delay-0   { animation-delay: 0ms; }
    .delay-70  { animation-delay: 70ms; }
    .delay-120 { animation-delay: 120ms; }
    .delay-170 { animation-delay: 170ms; }
    .delay-220 { animation-delay: 220ms; }
    .delay-300 { animation-delay: 300ms; }
    .delay-380 { animation-delay: 380ms; }
    .delay-490 { animation-delay: 490ms; }
    .delay-600 { animation-delay: 600ms; }
    .delay-720 { animation-delay: 720ms; }

    /* ----------------------------------------------------
       ACCESSIBILITY & REDUCED MOTION
    ---------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      .rise {
        opacity: 1 !important;
        filter: none !important;
        transform: none !important;
        animation: none !important;
      }
      .bg-video {
        filter: saturate(1.06) !important;
      }
    }

    /* ----------------------------------------------------
       RESPONSIVE ADJUSTMENTS
    ---------------------------------------------------- */
    @media (max-width: 720px) {
      .nav-links {
        display: none;
      }
      .hero-cta-row {
        flex-direction: column;
        gap: 16px;
      }
      .hero-kicker {
        letter-spacing: 0.20em;
      }
      .footer-meta {
        gap: 10px;
      }
      .meta-item {
        font-size: 10px;
        letter-spacing: 0.10em;
      }
    }
  </style>
</head>
<body>

  <!-- Background Video Element -->
  <div class="bg-video-wrap">
    <video
      id="fluxVideo"
      class="bg-video"
      src="https://zxdefgavgwfxastwmmjm.supabase.co/storage/v1/object/public/assets/flux.mp4"
      autoplay
      muted
      loop
      playsinline
    ></video>
  </div>

  <!-- Soft Ambient Wash Scrim with Faint Violet Bloom -->
  <div class="bg-scrim"></div>

  <!-- Full-Viewport Content -->
  <main class="viewport">
    
    <!-- Top Navbar -->
    <header class="navbar">
      <div class="nav-brand rise delay-0">
        <div class="brand-mark"></div>
        <span class="brand-wordmark">FLUX</span>
      </div>

      <nav>
        <ul class="nav-links">
          <li class="rise delay-70"><a href="#work" class="nav-link">Work</a></li>
          <li class="rise delay-120"><a href="#studio" class="nav-link">Studio</a></li>
          <li class="rise delay-170"><a href="#contact" class="nav-link">Contact</a></li>
        </ul>
      </nav>

      <a href="#contact" class="nav-cta rise delay-220">Start a project</a>
    </header>

    <!-- Center Hero -->
    <section class="hero">
      <div class="hero-kicker rise delay-300">
        MOTION &amp; BRAND
      </div>

      <h1 class="hero-title rise delay-380">
        Make it move<span class="dot">.</span>
      </h1>

      <p class="hero-sub rise delay-490">
        A studio for brands that refuse to sit still.
      </p>

      <div class="hero-cta-row rise delay-600">
        <a href="#work" class="btn-pill">
          <span>See our work</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 7H13M13 7L7.5 1.5M13 7L7.5 12.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a href="#contact" class="btn-text-link">
          Get in touch
        </a>
      </div>
    </section>

    <!-- Bottom Meta Row -->
    <footer class="footer-meta rise delay-720">
      <span class="meta-item">Brand identity</span>
      <span class="meta-dot"></span>
      <span class="meta-item">Motion design</span>
      <span class="meta-dot"></span>
      <span class="meta-item">Film &amp; CGI</span>
    </footer>

  </main>

  <!-- Video Autoplay Resilience Script -->
  <script>
    (function() {
      const video = document.getElementById('fluxVideo');
      if (!video) return;

      const attemptPlay = function() {
        video.play().catch(function() {
          /* browser policy deferred; ignore error */
        });
      };

      video.addEventListener('canplay', attemptPlay);
      window.addEventListener('load', attemptPlay);
      attemptPlay();
    })();
  </script>
</body>
</html>
